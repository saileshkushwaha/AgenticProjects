services:
  - type: web
    name: banking-app-api
    runtime: node
    plan: free
    buildCommand: cd BankingApp && npm install
    startCommand: cd BankingApp && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: KYC_VENDOR
        value: persona
