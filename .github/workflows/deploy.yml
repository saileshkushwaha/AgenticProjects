name: Deploy to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: BankingApp
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Verify git commit
        run: git log --oneline -3

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Clean install and build
        run: |
          cd BankingApp
          rm -rf node_modules package-lock.json dist .vite
          npm install
          echo "=== api.ts BASE line ==="
          grep "const BASE" src/services/api.ts
          npm run build
          echo "=== built JS URL (first 200 chars) ==="
          grep -oP '.{0,100}agenticprojects-nmyk\.onrender\.com.{0,100}' dist/assets/*.js | head -1

      - uses: actions/upload-pages-artifact@v3
        with:
          path: BankingApp/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
